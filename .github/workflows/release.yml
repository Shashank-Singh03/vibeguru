name: release

# Builds the self-contained Burrito binaries (no Erlang/Elixir needed on the user's
# machine) and attaches them to a GitHub Release. The `npx vibeguru` wrapper fetches
# the matching asset from releases/download/v<version>/<asset> — so the git tag MUST
# be v<version> and match the "version" in package.json / mix.exs.
#
# Burrito CANNOT build on Windows, but Linux can cross-compile ALL targets (Zig), so
# this is a single Ubuntu job. See deps/burrito README build-host matrix.
#
# To cut a release:
#   1. bump version in package.json + mix.exs
#   2. git tag v0.1.0 && git push --tags   (this workflow builds + publishes assets)
#   3. npm publish                          (publishes the wrapper that downloads them)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Pinned, NOT ubuntu-latest. The v0.1.0 build passed on the then-current image and
    # the identical workflow failed months later when `latest` rolled forward — an
    # unpinned runner silently changes the toolchain under a reproducible build.
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: prod
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      # Burrito 1.5 pins this EXACTLY — it errors if the version differs. Bump only
      # in lockstep with the burrito version in mix.lock.
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.15.2"

      # Burrito needs xz (all targets) and 7z (for the Windows target) on PATH.
      # Ubuntu 24.04 ships the `7zip` package, whose binary is `7zz`; older images
      # ship `p7zip-full`, whose binary is `7z`. Accept either and guarantee a `7z`
      # on PATH, because Burrito shells out to that exact name.
      - name: Install xz + 7z
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils
          sudo apt-get install -y p7zip-full || sudo apt-get install -y 7zip
          if ! command -v 7z >/dev/null 2>&1; then
            sudo ln -sf "$(command -v 7zz)" /usr/local/bin/7z
          fi
          7z i >/dev/null && echo "7z OK: $(command -v 7z)"

      - name: Fetch deps
        run: mix deps.get --check-locked

      # Recorded up front so a failure is diagnosable from the run page alone,
      # without pulling the raw log.
      - name: Toolchain versions
        run: |
          {
            echo "### Toolchain"
            echo '```'
            echo "runner : $ImageOS / $(lsb_release -ds 2>/dev/null || echo unknown)"
            echo "elixir : $(elixir --version | tr '\n' ' ')"
            echo "zig    : $(zig version)"
            echo "xz     : $(xz --version | head -1)"
            echo "7z     : $(command -v 7z)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # No BURRITO_TARGET -> builds every target in mix.exs releases/0.
      # Output is teed so the tail can be surfaced in the job summary on failure —
      # raw Actions logs need a signed-in session, the summary does not.
      - name: Build all Burrito targets
        run: set -o pipefail && mix release 2>&1 | tee /tmp/release.log

      - name: Surface build failure
        if: failure()
        run: |
          {
            echo "### \`mix release\` failed"
            echo '```'
            tail -n 120 /tmp/release.log 2>/dev/null || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage assets
        run: |
          mkdir -p dist
          mv burrito_out/vibeguru_linux        dist/vibeguru-linux-x64
          mv burrito_out/vibeguru_windows.exe  dist/vibeguru-windows-x64.exe
          mv burrito_out/vibeguru_macos_x86    dist/vibeguru-macos-x64
          mv burrito_out/vibeguru_macos_arm    dist/vibeguru-macos-arm64
          ls -la dist

      # Always uploaded — grab them from the run's "Artifacts" section. This makes a
      # manual (workflow_dispatch) run a safe build-only dry run with no tag needed.
      - uses: actions/upload-artifact@v4
        with:
          name: vibeguru-binaries
          path: dist/*
          if-no-files-found: error

      # Publishing a GitHub Release needs a tag to attach to, so this runs ONLY on a
      # v* tag push — never on a manual run (that's the "requires a tag" error you hit).
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          fail_on_unmatched_files: true
