name: release

# Builds the self-contained Burrito binaries (no Erlang/Elixir needed on the user's
# machine) and attaches them to a GitHub Release. The `npx vibeguru` wrapper fetches
# the matching asset from releases/download/v<version>/<asset> — so the git tag MUST
# be v<version> and match the "version" in package.json / mix.exs.
#
# Burrito CANNOT build on Windows, but Linux can cross-compile ALL targets (Zig), so
# this is a single Ubuntu job. See deps/burrito README build-host matrix.
#
# To cut a release:
#   1. bump version in package.json + mix.exs
#   2. git tag v0.1.0 && git push --tags   (this workflow builds + publishes assets)
#   3. npm publish                          (publishes the wrapper that downloads them)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Pinned, NOT ubuntu-latest. The v0.1.0 build passed on the then-current image and
    # the identical workflow failed months later when `latest` rolled forward — an
    # unpinned runner silently changes the toolchain under a reproducible build.
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: prod
    steps:
      - uses: actions/checkout@v4

      # PINNED, and it has to stay that way. Burrito cross-compiles by downloading a
      # prebuilt ERTS for each target from a third-party CDN (beam-machine-universal),
      # keyed on the EXACT OTP patch this runner has. A floating "27" resolves to the
      # newest patch, which regularly outruns that CDN: 27.3.4.17 has an official
      # Windows installer but no Linux or macOS build there, so the mac target 404s
      # after a full compile. 27.3.4.16 is the newest with all three.
      #
      # To bump: check the target below returns 200 for linux, macos AND windows
      # before changing it. The next step asserts this at runtime anyway.
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3.4.16"
          elixir-version: "1.18.5"

      # Burrito 1.5 pins this EXACTLY — it errors if the version differs. Bump only
      # in lockstep with the burrito version in mix.lock.
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.15.2"

      # Burrito needs xz (all targets) and 7z (for the Windows target) on PATH.
      # Ubuntu 24.04 ships the `7zip` package, whose binary is `7zz`; older images
      # ship `p7zip-full`, whose binary is `7z`. Accept either and guarantee a `7z`
      # on PATH, because Burrito shells out to that exact name.
      - name: Install xz + 7z
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils
          sudo apt-get install -y p7zip-full || sudo apt-get install -y 7zip
          if ! command -v 7z >/dev/null 2>&1; then
            sudo ln -sf "$(command -v 7zz)" /usr/local/bin/7z
          fi
          7z i >/dev/null && echo "7z OK: $(command -v 7z)"

      # Fail in seconds with a clear reason, instead of two minutes into `mix release`
      # with a stack trace from inside Burrito's ERTS resolver. The OTP version is read
      # exactly the way Burrito reads it, so this asks the same question it will ask.
      - name: Verify a prebuilt ERTS exists for this OTP
        run: |
          set -euo pipefail
          OTP=$(erl -noshell -eval '{ok,B}=file:read_file(filename:join([code:root_dir(),"releases",erlang:system_info(otp_release),"OTP_VERSION"])), io:format("~s",[string:trim(binary_to_list(B))]), halt().')
          echo "OTP $OTP"
          CDN="https://beam-machine-universal.b-cdn.net/OTP-$OTP"
          Q="?please-respect-my-bandwidth-costs=thank-you&openssl=3.5.1&musl=1.2.5"

          fail=0
          for pair in "linux:$CDN/linux/x86_64/any/otp_${OTP}_linux_any_x86_64.tar.gz$Q" "macos:$CDN/macos/universal/otp_${OTP}_macos_universal.tar.gz$Q"; do
            name=${pair%%:*}
            url=${pair#*:}
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$url" || echo 000)
            echo "  $name -> $code"
            [ "$code" = "200" ] || fail=1
          done

          if [ "$fail" -ne 0 ]; then
            echo "::error title=No prebuilt ERTS for OTP $OTP::beam-machine-universal has not built OTP $OTP for every target, so Burrito cannot cross-compile. Pin otp-version in this workflow to a patch that is fully published (27.3.4.16 was, at the time of writing)."
            exit 1
          fi

      - name: Fetch deps
        run: mix deps.get --check-locked

      - name: Verify Burrito toolchain
        run: |
          set -euo pipefail
          ZIG_EXPECTED=0.15.2

          # Burrito's pre_check exits immediately when `zig` or `xz` are missing, or
          # when zig is not EXACTLY the version it pins — before compiling anything,
          # so it looks identical to a build failure. Assert it here, where the
          # message can say which one was wrong.
          #
          # `set -e` is load-bearing: without it a missing binary inside $(...) just
          # prints an empty string and the step still passes, which is exactly how
          # this went undiagnosed.
          for tool in zig xz; do
            command -v "$tool" >/dev/null 2>&1 || {
              echo "::error title=Missing toolchain::Burrito requires '$tool' on PATH and it is not there."
              exit 1
            }
          done

          ZIG_ACTUAL=$(zig version)
          echo "runner : ${ImageOS:-unknown} / $(lsb_release -ds 2>/dev/null || echo unknown)"
          echo "elixir : $(elixir --version | tail -1)"
          echo "zig    : $ZIG_ACTUAL (burrito requires exactly $ZIG_EXPECTED)"
          echo "xz     : $(xz --version | head -1)"
          echo "7z     : $(command -v 7z || echo 'not found')"

          if [ "$ZIG_ACTUAL" != "$ZIG_EXPECTED" ]; then
            echo "::error title=Zig version mismatch::Burrito requires exactly $ZIG_EXPECTED, runner has $ZIG_ACTUAL. Bump the setup-zig pin in lockstep with the burrito version in mix.lock."
            exit 1
          fi

      # No BURRITO_TARGET -> builds every target in mix.exs releases/0.
      # Output is teed so the tail can be surfaced in the job summary on failure —
      # raw Actions logs need a signed-in session, the summary does not.
      - name: Build all Burrito targets
        run: set -o pipefail && mix release 2>&1 | tee /tmp/release.log

      # Two channels, because this repo's Actions logs AND its job summaries both
      # require a signed-in session to read, while annotations do not. The ::error::
      # workflow command puts the failure on the run page where anyone can see it.
      - name: Surface build failure
        if: failure()
        run: |
          tail -n 120 /tmp/release.log 2>/dev/null > /tmp/tail.log || echo "(no output captured)" > /tmp/tail.log
          {
            echo "### \`mix release\` failed"
            echo '```'
            cat /tmp/tail.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Annotations are single-line, so flatten and cap.
          FLAT=$(paste -sd' ' /tmp/tail.log | tr -s ' ' | cut -c1-900)
          echo "::error title=mix release failed::${FLAT}"

      - name: Stage assets
        run: |
          mkdir -p dist
          mv burrito_out/vibeguru_linux        dist/vibeguru-linux-x64
          mv burrito_out/vibeguru_windows.exe  dist/vibeguru-windows-x64.exe
          mv burrito_out/vibeguru_macos_x86    dist/vibeguru-macos-x64
          mv burrito_out/vibeguru_macos_arm    dist/vibeguru-macos-arm64
          ls -la dist

      # Always uploaded — grab them from the run's "Artifacts" section. This makes a
      # manual (workflow_dispatch) run a safe build-only dry run with no tag needed.
      - uses: actions/upload-artifact@v4
        with:
          name: vibeguru-binaries
          path: dist/*
          if-no-files-found: error

      # Publishing a GitHub Release needs a tag to attach to, so this runs ONLY on a
      # v* tag push — never on a manual run (that's the "requires a tag" error you hit).
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          fail_on_unmatched_files: true
